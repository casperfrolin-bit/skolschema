<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>9B - SchemavisarePRO</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
<script>
// Måttenheter: 1 enhet = 1 % av fönstrets storlek vid sidladdning/fönsterändring.
// Vid webbläsarzoom (Ctrl +/-) ändras inte enheterna, så hela sidan skalas och flyttas som en helhet.
(function () {
  var d = document.documentElement, lastPhys = window.innerWidth * window.devicePixelRatio;
  function apply() {
    var w = window.innerWidth, h = window.innerHeight;
    d.style.setProperty("--vw", w / 100 + "px");
    d.style.setProperty("--vh", h / 100 + "px");
    d.classList.toggle("wide", w >= h && w >= 900);
    d.classList.toggle("narrow", w <= 900);
    lastPhys = w * window.devicePixelRatio;
  }
  apply();
  window.addEventListener("resize", function () {
    // Zoom ändrar CSS-bredden men inte antalet riktiga pixlar -> gör inget. Annars är det en riktig storleksändring.
    if (Math.abs(window.innerWidth * window.devicePixelRatio - lastPhys) > 4) apply();
  });
})();
</script>
<style>
*{box-sizing:border-box}
:root{--vw:1vw;--vh:1vh;--u:min(var(--vw),calc(var(--vh)*1.7));--h:calc(clamp(26px,calc(var(--vw)*3.2),58px)*1.1 + var(--vh)*1.5);--bg:#f4f4f4;--panel:#fff;--text:#111;--muted:#666;--line:#d9d9d9;--hl:#111;--hl-text:#fff}
:root[data-theme=dark]{--bg:#151515;--panel:#222;--text:#f2f2f2;--muted:#aaa;--line:#3a3a3a;--hl:#f2f2f2;--hl-text:#111}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;display:flex;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);letter-spacing:-.015em}
.screen{position:relative;flex:none;margin:auto;width:calc(var(--vw)*100);min-height:calc(var(--vh)*100);display:flex;flex-direction:column;gap:calc(var(--vh)*2);padding:calc(var(--vh)*2) calc(var(--vw)*2.5)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:calc(var(--vw)*2)}
.time{display:flex;flex-direction:column;gap:calc(var(--vh)*.6)}
.class-sel{align-self:flex-start;margin-top:calc(var(--vh)*.8);font:inherit;font-size:clamp(14px,calc(var(--vw)*1.6),28px);font-weight:700;padding:.35em 1.8em .35em .8em;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);cursor:pointer}
.class-sel:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.class-name{font-size:clamp(35.2px,calc(var(--vw)*5.6),104px);font-weight:800;line-height:1;text-align:center}
.clock{font-size:clamp(27.2px,calc(var(--vw)*3.6),64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.date{font-size:clamp(12.8px,calc(var(--vw)*1.44),25.6px);color:var(--muted)}
.now{margin-top:calc(var(--vh)*1);width:0;min-width:100%}
.layout{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:calc(var(--vw)*2);min-height:0}
.left,.mid,.right{display:flex;flex-direction:column;min-height:0}
.left{align-items:center;padding-top:var(--h)}
.right{padding-bottom:calc(var(--vh)*4)}
.sched{width:min(100%,calc((var(--vh)*64 - var(--h))*.975))}
.schedule-img{display:block;position:relative;overflow:hidden}
.time-line{position:absolute;left:0;right:0;height:2px;margin-top:-1px;background:#e53935;display:none;pointer-events:none}
.schedule-img img{display:block;width:100%;height:auto}
.img-dark{display:none}
:root[data-theme=dark].has-dark .img-light{display:none}
:root[data-theme=dark].has-dark .img-dark{display:block}
:root[data-theme=dark]:not(.has-dark) .img-light{filter:invert(1)}
/* Hel A4-bild: tabellen klipps ut med CSS (ingen fetch/base64/SVG-omväg) */
.schedule-img.crop{aspect-ratio:1090/1064}
.schedule-img.crop .img-light{position:absolute;display:block;width:109.27%;max-width:none;height:auto;left:-4.587%;top:-23.68%}
.schema-err{display:none;padding:1.2em;border:2px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:clamp(12px,calc(var(--vw)*1.2),20px)}
.schedule-img.err .schema-err{display:block}
.schedule-img.err img{display:none!important}
.current{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 calc(var(--vw)*2)}
.lesson{font-size:clamp(20.8px,calc(var(--vw)*2.88),51.2px);font-weight:800}
.lesson-time{font-size:clamp(16px,calc(var(--vw)*1.92),35.2px);font-weight:700;color:var(--muted);white-space:nowrap}
.remaining{font-size:clamp(11.2px,calc(var(--vw)*1.2),20.8px);color:var(--muted);margin-top:calc(var(--vh)*.6);font-variant-numeric:tabular-nums}
/* Matsedel: kompakt, skalas efter enhetens storlek (--u = den minsta av bredd/höjd-enheten) */
h1{margin:0 0 calc(var(--u)*.9);font-size:clamp(18px,calc(var(--u)*2.1),48px);line-height:1.1;font-weight:800}
.menu{flex:none;display:flex;flex-direction:column;gap:calc(var(--u)*.6);width:100%}
.day{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*1.4);align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:calc(var(--u)*1);padding:calc(var(--u)*.7) calc(var(--u)*1.2)}
.day.active{background:var(--hl);color:var(--hl-text);border-color:var(--hl)}
.day-name{font-size:clamp(12px,calc(var(--u)*1.15),30px);font-weight:800}
.day-date{font-size:clamp(9.5px,calc(var(--u)*.75),20px);opacity:.7}
.food,.items{text-align:right;font-size:clamp(10.5px,calc(var(--u)*.95),26px);line-height:1.25}
.food div+div{opacity:.8;margin-top:calc(var(--u)*.25)}
.theme-btn{position:fixed;right:max(calc(var(--vw)*2),env(safe-area-inset-right));bottom:max(calc(var(--vh)*2),env(safe-area-inset-bottom));width:clamp(38px,calc(var(--vw)*3.4),54px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:55%;height:55%}
.theme-btn:focus-visible{outline:3px solid var(--text);outline-offset:2px}
html.wide .screen{height:calc(var(--vh)*100);min-height:0;overflow:hidden}
html.wide .layout{grid-template-columns:auto minmax(0,1fr) minmax(0,calc(var(--vw)*26));margin:0}
html.wide .left{height:100%;min-height:0;padding-top:0;justify-content:center}
html.wide .right{position:relative;height:80%;align-self:center;justify-content:flex-start;padding-bottom:0}
html.wide h1{position:absolute;left:0;bottom:100%;margin:0 0 calc(var(--u)*.6)}
html.wide .food,html.wide .items{font-size:clamp(11px,calc(var(--u)*1.1),30px)}
html.wide .day-name{font-size:clamp(13px,calc(var(--u)*1.3),34px)}
html.wide .sched{height:80%;align-self:center;width:auto;display:grid;grid-template-columns:min-content;grid-template-rows:minmax(0,1fr) auto}
html.wide .schedule-img{min-height:0}
html.wide .schedule-img img{height:100%;width:auto;aspect-ratio:1090/1064}
html.wide .lesson{font-size:clamp(14.4px,calc(var(--vh)*2.56),51.2px);line-height:1.15}
html.wide .lesson-time{font-size:clamp(11.2px,calc(var(--vh)*1.92),35.2px)}
html.wide .remaining{font-size:clamp(10.4px,calc(var(--vh)*1.52),22.4px)}
html.wide .theme-btn{position:absolute}
html.narrow .screen{padding-bottom:calc(var(--vw)*18)}
html.narrow .left{padding-top:0}
html.narrow .layout{grid-template-columns:1fr}
html.narrow .schedule-img img{height:auto}
html.narrow .sched{width:100%}
html.narrow .food,html.narrow .items{font-size:clamp(12px,calc(var(--vw)*3.3),20px)}
html.narrow .day-name{font-size:clamp(14px,calc(var(--vw)*3.8),24px)}
html.narrow h1{font-size:clamp(20px,calc(var(--vw)*6),36px)}
html.narrow .menu{gap:calc(var(--vw)*2)}
html.narrow .day{padding:calc(var(--vw)*2.5) calc(var(--vw)*3.5);border-radius:calc(var(--vw)*3)}

/* ---------- Prov & läxor, navigering ---------- */
:root{--prov:#d32f2f;--glosor:#1967D2;--lov:#2E7D32;--studiedag:#43A047;--aktivitet:var(--line)}
.prov{--c:var(--prov)}.glosor{--c:var(--glosor)}.lov{--c:var(--lov)}.studiedag{--c:var(--studiedag)}.aktivitet{--c:var(--event-color,var(--aktivitet))}
.right{grid-column:2;grid-row:1}
.mid{grid-column:1/-1;grid-row:2;padding:calc(var(--u)*1.1);padding-bottom:calc(var(--vh)*2);border:2px solid var(--line);border-radius:calc(var(--u)*1.2);background:color-mix(in srgb,var(--panel) 90%,var(--line));box-shadow:0 3px 12px #0000000a}
.head{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1);margin:0 0 calc(var(--u)*.9)}
.head h1{margin:0}
.seg{display:flex;border:2px solid var(--line);border-radius:calc(var(--u)*.9);overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-weight:700;font-size:clamp(11px,calc(var(--u)*1),24px);padding:.35em .9em;border:0;background:none;color:var(--text);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--hl);color:var(--hl-text)}
.cal{flex:1 1 auto;min-height:0;overflow:hidden;padding:3px;margin:-3px}
.cal .menu{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(5,minmax(0,1fr));height:100%;min-height:0;align-content:stretch;gap:calc(var(--u)*.55)}
.cal .day{grid-template-columns:clamp(64px,calc(var(--u)*7),110px) minmax(0,1fr);align-items:start;min-width:0;min-height:0;overflow:hidden}
.items{text-align:left;display:flex;flex-direction:column;gap:calc(var(--u)*.2);min-width:0;min-height:0;overflow:hidden}
.it{display:flex;gap:.6em;align-items:baseline;min-width:0}
.event-item{appearance:none;-webkit-appearance:none;display:flex;width:100%;min-width:0;font:inherit;font-size:clamp(10px,.88em,18px);line-height:1.15;text-align:left;color:inherit;background:transparent;border:0;padding:.15em .2em;border-radius:.35em;cursor:pointer}
.event-item:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.event-item:hover .txt{text-decoration:underline}
.event-item:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.tag{background:var(--c,var(--event-color,var(--line)))}
.dots i{background:var(--c,var(--event-color,var(--line)))}
.cal .day .day-name{line-height:1.2}
.cal .day .day-date{margin-top:.2em}
.more-events{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:clamp(10px,.85em,16px);line-height:1.1;font-weight:800;text-align:left;padding:0 .2em;min-width:0;overflow-wrap:anywhere;cursor:pointer;border-radius:.35em}
.more-events:hover{text-decoration:underline;background:color-mix(in srgb,var(--text) 5%,transparent)}
.event-dialog{width:min(92vw,560px);max-height:82vh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:1.2rem;background:var(--panel);color:var(--text);box-shadow:0 12px 50px #0004}
.event-dialog::backdrop{background:#0008}
.event-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.event-dialog h2{margin:0 0 .5rem;font-size:1.35rem}
.event-dialog p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.event-dialog .event-meta{color:var(--muted);font-size:.92rem}
.event-close{font:inherit;font-size:1.4rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:.15rem .6rem;cursor:pointer}
.tag{flex:none;background:var(--c,var(--event-color,var(--line)));color:#fff;font-weight:800;font-size:.8em;line-height:1.3;padding:.05em .55em;border-radius:.5em}
.event-item.prov .tag{background:var(--prov)}.event-item.glosor .tag{background:var(--glosor)}.event-item.lov .tag{background:var(--lov)}.event-item.studiedag .tag{background:var(--studiedag)}
.dots i.prov{background:var(--prov)}.dots i.glosor{background:var(--glosor)}.dots i.lov{background:var(--lov)}.dots i.studiedag{background:var(--studiedag)}
.txt{min-width:0;overflow-wrap:anywhere}
.none{opacity:.45}
.nav{margin-top:auto;padding-top:calc(var(--u)*1);display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:calc(var(--u)*.6)}
.nbtn{font:inherit;font-weight:800;font-size:clamp(14px,calc(var(--u)*1.3),30px);min-width:clamp(38px,calc(var(--u)*3),60px);height:clamp(38px,calc(var(--u)*3),60px);padding:0 .7em;border:2px solid var(--line);border-radius:calc(var(--u)*.9);background:var(--panel);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.nav .nbtn:not(.today-btn){font-size:clamp(20px,calc(var(--u)*1.7),32px);padding:0;text-align:center}
.nbtn:hover{border-color:var(--text);background:color-mix(in srgb,var(--text) 5%,var(--panel))}
.nbtn:focus-visible,.seg button:focus-visible,.md:focus-visible,.mw:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.today-btn{font-size:clamp(11px,calc(var(--u)*1),22px)}
.nlabel{width:100%;min-width:0;text-align:center;justify-self:stretch;align-self:center;line-height:1.15;font-weight:800;font-size:clamp(12px,calc(var(--u)*1.15),30px)}
.nlabel small{display:block;font-weight:600;color:var(--muted);font-size:.8em}
.mgrid{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:calc(var(--u)*.35);min-height:0;align-content:start}
.mgrid+.day{margin-top:calc(var(--u)*.15)}
.mh{text-align:center;color:var(--muted);font-weight:700;font-size:clamp(10px,calc(var(--u)*.85),22px)}
.mw{font:inherit;font-weight:700;font-size:clamp(10px,calc(var(--u)*.85),22px);border:0;background:none;color:var(--muted);cursor:pointer;padding:0 calc(var(--u)*.5);border-radius:calc(var(--u)*.5)}
.mw:hover{color:var(--text)}
.md{font:inherit;font-weight:700;font-size:clamp(11px,calc(var(--u)*1),26px);aspect-ratio:1/.9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.2);padding:0;border:2px solid var(--line);border-radius:calc(var(--u)*.7);background:var(--panel);color:var(--text);cursor:pointer}
.md.out{opacity:.4}
.md.today{background:var(--hl);color:var(--hl-text);border-color:var(--hl)}
.md.sel{outline:3px solid var(--text);outline-offset:1px}
.dots{display:flex;gap:2px;height:calc(var(--u)*.55)}
.dots i{width:calc(var(--u)*.55);height:calc(var(--u)*.55);min-width:5px;min-height:5px;border-radius:50%;background:var(--c,var(--event-color,var(--line)))}
html.wide .layout>.right,html.wide .layout>.mid{grid-column:auto;grid-row:auto}
html.wide .mid{position:relative;height:80%;min-height:0;align-self:center;padding:calc(var(--u)*.85);padding-bottom:calc(var(--u)*.85);overflow:hidden}
html.wide .head{position:relative;left:auto;right:auto;bottom:auto;margin:0 0 calc(var(--u)*.9);flex-shrink:0}
html.wide .head h1{position:static;margin:0}
html.wide .cal:has(.mgrid){display:flex;flex-direction:column;gap:calc(var(--u)*.25)}
html.wide .cal:has(.mgrid) .mgrid{flex:0 0 auto;grid-template-rows:repeat(7,minmax(0,1fr))}
html.wide .cal:has(.mgrid) .md{aspect-ratio:auto;height:clamp(20px,calc(var(--vh)*3.8),36px);min-height:0}
html.wide .cal:has(.mgrid) .mgrid+.day{flex:1 1 0;min-height:0;margin-top:calc(var(--u)*.15);overflow:hidden}
html.wide .cal:has(.mgrid) .mgrid+.day .items{gap:1px}
html.wide .cal:has(.mgrid) .mgrid+.day .event-item{font-size:clamp(10px,.78em,16px);line-height:1.08;padding:0 .12em}
html.wide .cal:has(.mgrid) .mgrid+.day .tag{font-size:.72em;padding:0 .35em}
html.wide .cal:has(.mgrid) .mgrid+.day .more-events{font-size:clamp(9px,.72em,14px);line-height:1;padding:0 .12em}
html.narrow .layout>.right,html.narrow .layout>.mid{grid-column:auto;grid-row:auto}
html.narrow .layout{row-gap:calc(var(--vw)*6)}
html.narrow .mid{padding:calc(var(--vw)*2.5);overflow:hidden;min-height:0}
html.narrow .cal .day{grid-template-columns:clamp(58px,calc(var(--vw)*19),84px) minmax(0,1fr);gap:calc(var(--vw)*2.5);padding:calc(var(--vw)*2.3) calc(var(--vw)*2.8);align-items:start}
html.narrow .cal .menu{grid-template-rows:repeat(5,minmax(0,1fr));gap:calc(var(--vw)*2)}
html.narrow .cal .items{gap:calc(var(--vw)*1.1)}
html.narrow .cal .event-item{font-size:clamp(12px,calc(var(--vw)*3.2),18px);line-height:1.35}
html.narrow .nbtn{font-size:clamp(16px,calc(var(--vw)*5),28px);min-width:clamp(42px,calc(var(--vw)*11),56px);height:clamp(42px,calc(var(--vw)*11),56px)}
html.narrow .today-btn{font-size:clamp(12px,calc(var(--vw)*3.2),18px)}
html.narrow .nlabel{font-size:clamp(14px,calc(var(--vw)*4),22px)}
html.narrow .seg button{font-size:clamp(13px,calc(var(--vw)*3.6),20px)}
html.narrow .md{font-size:clamp(12px,calc(var(--vw)*3.6),22px)}
html.narrow .mh,html.narrow .mw{font-size:clamp(11px,calc(var(--vw)*3),18px)}

/* ---------- Sidfot: kontakt och användbara länkar ---------- */
.site-footer{flex:none;margin-top:calc(var(--u)*.6);padding:calc(var(--u)*1.1) calc(var(--u)*1.3);border:2px solid var(--line);border-radius:calc(var(--u)*1.2);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:calc(var(--u)*1.2);align-items:center}
.footer-contact{min-width:0}
.footer-title{font-size:clamp(12px,calc(var(--u)*1.05),22px);font-weight:800;margin-bottom:.25em}
.footer-note{font-size:clamp(10px,calc(var(--u)*.78),16px);color:var(--muted);line-height:1.35;margin-bottom:.35em}
.footer-mail{font-size:clamp(11px,calc(var(--u)*.9),18px);font-weight:750;overflow-wrap:anywhere;color:var(--text);text-decoration:none}
.footer-mail:hover{text-decoration:underline}
.footer-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*.55)}
.footer-link{min-width:0;min-height:clamp(34px,calc(var(--u)*3),54px);display:flex;align-items:center;justify-content:center;gap:.4em;padding:.5em .55em;border:1.5px solid var(--line);border-radius:calc(var(--u)*.7);font-size:clamp(10px,calc(var(--u)*.8),17px);font-weight:750;text-align:center;text-decoration:none;color:var(--text);background:var(--bg);transition:transform .15s ease,filter .15s ease}
.footer-link:hover{transform:translateY(-2px);filter:brightness(.97)}
.footer-link .link-icon{width:1.25em;height:1.25em;flex:none;display:inline-grid;place-items:center}
.footer-link .link-icon svg,.footer-mail .mail-icon{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.footer-mail{display:inline-flex;align-items:center;gap:.45em}
.footer-mail .mail-icon{width:1.1em;height:1.1em;flex:none}
.footer-link.portal{border-color:#0b7a75;color:#08716c}
.footer-link.classroom{border-color:#4285f4;color:#1a73e8}
.footer-link.calendar{border-color:#34a853;color:#188038}
.footer-link.drive{border-color:#fbbc04;color:#9a6700}
:root[data-theme=dark] .footer-link.portal{color:#65d9d1}
:root[data-theme=dark] .footer-link.classroom{color:#8ab4f8}
:root[data-theme=dark] .footer-link.calendar{color:#81c995}
:root[data-theme=dark] .footer-link.drive{color:#fdd663}
html.narrow .site-footer{grid-template-columns:1fr;gap:calc(var(--vw)*3);padding:calc(var(--vw)*3.5)}
html.narrow .footer-links{grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--vw)*2)}
html.narrow .footer-link{font-size:clamp(12px,calc(var(--vw)*3.2),17px);min-height:42px}
html.narrow .footer-title{font-size:clamp(15px,calc(var(--vw)*4),22px)}
html.narrow .footer-note{font-size:clamp(12px,calc(var(--vw)*3),16px)}

: "12:10", "subject": "Språkval", "room": "Sal 2 / Sal 5 / Sal 1"}, {"day": "torsdag", "start": "12:20", "end": "12:40", "subject": "Lunch", "room": ""}, {"day": "torsdag", "start": "12:50", "end": "14:00", "subject": "Fysik", "room": "NO 2"}, {"day": "torsdag", "start": "14:10", "end": "15:30", "subject": "Svenska", "room": "Sal 1"}, {"day": "fredag", "start": "08:30", "end": "09:40", "subject": "Svenska", "room": "Sal 1"}, {"day": "fredag", "start": "10:00", "end": "11:10", "subject": "Matematik", "room": "Sal 3"}, {"day": "fredag", "start": "11:20", "end": "12:10", "subject": "Språkval", "room": "Sal 1 / Sal 2 / Sal 5"}, {"day": "fredag", "start": "12:10", "end": "12:30", "subject": "Lunch", "room": ""}, {"day": "fredag", "start": "12:50", "end": "14:00", "subject": "Idrott", "room": "Tofta 2"}]}</script>

<script>
const TZ = "Europe/Stockholm";
const DAYS = ["måndag","tisdag","onsdag","torsdag","fredag"];
// Tidslinjen: y-position (px i den beskurna bilden, 1064 px hög) för 07:00 och pixlar per timme.
const Y7 = 62.5, PER_HOUR = 90.36, IMG_H = 1064;
const SCHEMA_IMG = {
  "9A": "schema-9A.png",
  "9B": "schema-9B.png"
};
const readSeed = id => { try { return JSON.parse(document.getElementById(id).textContent); } catch { return null; } };
const readCache = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const saveCache = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
// Det senast kända visas direkt; färsk data hämtas i bakgrunden och byts in när den kommer.
// Schemat ligger som {"9A": [...], "9B": [...]}. En gammal platt lista räknas som 9B.
const normSched = v => Array.isArray(v) ? {"9A": [], "9B": v} : (v && typeof v === "object" ? v : null);
let schedules = [normSched(readCache("schedule")), normSched(readSeed("seed-schedule"))].find(Boolean) || {};
let cls = "9B";
try { const q = new URLSearchParams(location.search).get("klass"); const s = q || localStorage.getItem("klass"); if (SCHEMA_IMG[s]) cls = s; } catch {}

// ---------- Tid från internet (inte enhetens klocka) ----------
// Klockan räknar vidare med performance.now(), så den påverkas inte om någon ändrar enhetens klocka.
let base = {server: Date.now(), perf: performance.now()}, synced = false, lastSync = -1e9, trusted = false;
try { const o = localStorage.getItem("timeOffset"); if (o !== null && Number.isFinite(+o)) { base.server += +o; trusted = true; } } catch {}
const now = () => new Date(base.server + (performance.now() - base.perf));
const getJSON = async (url) => {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return r.json();
};
const TIME_SOURCES = [
  async () => { const j = await getJSON("https://worldtimeapi.org/api/timezone/Etc/UTC");
    return j.unixtime * 1000 + (+(String(j.datetime).match(/\.(\d{3})/)?.[1] ?? 0)); },
  async () => { const j = await getJSON("https://timeapi.io/api/time/current/zone?timeZone=UTC");
    return Date.parse(String(j.dateTime).replace(/(\.\d{3})\d*/, "$1") + "Z"); },
  async () => { const r = await fetch(location.href.split("#")[0], {method: "HEAD", cache: "no-store"});
    const d = r.headers.get("Date"); if (!d) throw new Error("no date"); return Date.parse(d) + 500; }
];
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
async function syncTime() {
  // Alla källor frågas samtidigt; den första (i prioritetsordning) som svarar används.
  const runs = TIME_SOURCES.map(src => { const p0 = performance.now();
    return withTimeout(src(), 3000).then(ms => ({ms, p0, p1: performance.now()})); });
  runs.forEach(r => r.catch(() => {}));
  for (const r of runs) {
    try {
      const {ms, p0, p1} = await r;
      if (!Number.isFinite(ms)) continue;
      base = {server: ms + (p1 - p0) / 2, perf: p1};
      synced = trusted = true; lastSync = p1;
      try { localStorage.setItem("timeOffset", String(Math.round(base.server - Date.now()))); } catch {}
      document.getElementById("clock").style.opacity = "";
      tick();
      return true;
    } catch {}
  }
  if (!trusted) document.getElementById("clock").style.opacity = ".55"; // visar att internettid saknas
  return false;
}

function parts(d) {
  const o = {};
  new Intl.DateTimeFormat("sv-SE", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"})
    .formatToParts(d).forEach(p => o[p.type] = p.value);
  return o;
}
function isoWeek(y, m, d) {
  const t = new Date(Date.UTC(y, m - 1, d));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const hms = s => [Math.floor(s/3600), Math.floor(s%3600/60), s%60];
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };

// ---------- Tema ----------
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch {}
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  document.getElementById("themeBtn").innerHTML = t === "dark" ? sun : moon;
}
let saved = "light"; try { saved = localStorage.getItem("theme") || "light"; } catch {}
setTheme(saved);
document.getElementById("themeBtn").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

// ---------- Rendering ----------
function tick() {
  const d = now(), p = parts(d);
  const weekday = cap(new Intl.DateTimeFormat("sv-SE", {timeZone:TZ, weekday:"long"}).format(d));
  const month = new Intl.DateTimeFormat("sv-SE", {timeZone:TZ, month:"long"}).format(d);
  const week = isoWeek(+p.year, +p.month, +p.day);
  document.getElementById("clock").textContent = `${p.hour}:${p.minute}:${p.second}`;
  document.getElementById("date").textContent = `${weekday} ${+p.day} ${month} ${p.year} (v. ${week})`;

  const sec = +p.hour*3600 + +p.minute*60 + +p.second;
  const line = document.getElementById("timeLine");
  const hrs = sec/3600;
  if (DAYS.includes(weekday.toLowerCase()) && hrs >= 7 && hrs < 18) {
    const y = Y7 + (hrs - 7) * PER_HOUR;
    line.style.top = (y / IMG_H * 100) + "%";
    line.style.display = "block";
  } else line.style.display = "none";
  const lessons = (schedules[cls] || []).filter(x => x.day === weekday.toLowerCase());
  const cur = lessons.find(x => sec >= toMin(x.start)*60 && sec < toMin(x.end)*60);
  const next = lessons.find(x => toMin(x.start)*60 > sec);
  const el = id => document.getElementById(id);
  const fmt = s => { const [h,m,sc] = hms(s); return (h ? h + " tim " : "") + m + " min " + sc + " sek"; };
  const L = cur || next;
  const room = L && L.room ? ` (${L.room})` : "";
  if (cur) {
    el("lesson").textContent = cur.subject + room;
    el("lessonTime").textContent = `${cur.start.replace(":",".")}–${cur.end.replace(":",".")}`;
    el("remaining").textContent = "Tid till slut: " + fmt(toMin(cur.end)*60 - sec);
  } else if (next) {
    const started = lessons.some(x => toMin(x.end)*60 <= sec);
    el("lesson").textContent = started ? "Rast" : "Skoldagen har inte börjat";
    el("lessonTime").textContent = `Nästa lektion: ${next.subject}${room}`;
    el("remaining").textContent = "Börjar om " + fmt(toMin(next.start)*60 - sec);
  } else {
    el("lesson").textContent = "Ingen lektion";
    el("lessonTime").textContent = "";
    el("remaining").textContent = "";
  }
  const t = p.year + "-" + p.month + "-" + p.day;
  if (t !== lastDay) { lastDay = t; renderAll(); }   // ny dag -> rita om matsedel och kalender
}

// ---------- Datum ----------
const MD = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const MF = ["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];
const WD = ["Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag","Söndag"];
const DK = ["mån","tis","ons","tors","fre"];                       // nycklarna i matsedel.js
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const utc = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const iso = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => new Date(d.getTime() + n * 864e5);
const monOf = d => addDays(d, -((d.getUTCDay() + 6) % 7));
const dLabel = d => d.getUTCDate() + " " + MD[d.getUTCMonth()];
const weekNo = mon => { const th = addDays(mon, 3), y = th.getUTCFullYear(); return {y, w: isoWeek(y, th.getUTCMonth() + 1, th.getUTCDate())}; };
const rangeTxt = mon => { const b = addDays(mon, 4);
  return mon.getUTCMonth() === b.getUTCMonth() ? `${mon.getUTCDate()}–${dLabel(b)}` : `${dLabel(mon)} – ${dLabel(b)}`; };
const todayISO = () => { const p = parts(now()); return `${p.year}-${p.month}-${p.day}`; };
// Veckan som visas från start. Lördag/söndag visar nästa vecka.
const baseMonday = () => { const t = utc(todayISO()), wd = t.getUTCDay() || 7; return addDays(t, -(wd - 1) + (wd > 5 ? 7 : 0)); };

// ---------- Tillstånd: hur många veckor/månader man bläddrat från "nu" ----------
let menuOff = 0, calOff = 0, monOff = 0, selDay = null, touched = 0, lastDay = "";
let calView = "week"; try { if (localStorage.getItem("calView") === "month") calView = "month"; } catch {}
const touch = () => { touched = performance.now(); };
const setNav = (id, big, small, off) => {
  document.getElementById(id + "Lbl").innerHTML = `${esc(big)}<small>${esc(small)}</small>`;
  document.getElementById(id + "Today").style.visibility = off ? "visible" : "hidden";
};

// ---------- Matsedel (data i matsedel.js) ----------
function renderMenu() {
  const mon = addDays(baseMonday(), menuOff * 7), t = todayISO(), {y, w} = weekNo(mon);
  // Hämta den vecka besökaren faktiskt tittar på, inte alltid den vecka som råkar finnas i menu.json.
  if (typeof window.loadMenuWeek === "function") window.loadMenuWeek(y, w);
  const wk = (typeof MATSEDEL !== "undefined" && MATSEDEL[`${y}-v${String(w).padStart(2, "0")}`]) || {};
  document.getElementById("menu").innerHTML = DK.map((k, i) => {
    const d = addDays(mon, i), rows = [].concat(wk[k] || []).map(x => String(x).trim()).filter(Boolean);
    return `<article class="day${iso(d) === t ? " active" : ""}">
      <div><div class="day-name">${WD[i]}</div><div class="day-date">${dLabel(d)}</div></div>
      <div class="food"><div>${esc(rows[0] || "Ingen uppgift")}</div><div>${esc(rows.slice(1).join(" / "))}</div></div></article>`;
  }).join("");
  setNav("menu", `v. ${w}`, `${rangeTxt(mon)} ${y}`, menuOff);
}

// ---------- Prov & läxor (data i kalender.js) ----------
const typeOf = t => { const s = String(t || "").toLowerCase();
  return /^pro?v/.test(s) ? "prov" : /^glosor?$/.test(s) ? "glosor" : s === "lov" ? "lov" : s === "studiedag" ? "studiedag" : "aktivitet"; };
function events() {                                   // {"2026-10-28": [händelser]} för vald klass
  const m = {}, rank = {prov: 0, glosor: 1, lov: 2, studiedag: 2, aktivitet: 3}, re = /^\d{4}-\d{2}-\d{2}$/;
  (typeof KALENDER !== "undefined" && Array.isArray(KALENDER) ? KALENDER : []).forEach(e => {
    if (!e || !re.test(e.datum || "")) return;
    if (e.klass && !String(e.klass).toUpperCase().includes(cls)) return;
    const last = re.test(e.till || "") ? e.till : e.datum;
    for (let d = utc(e.datum), n = 0; n < 62 && iso(d) <= last; n++, d = addDays(d, 1)) (m[iso(d)] ||= []).push(e);
  });
  for (const k in m) m[k].sort((a, b) => rank[typeOf(a.typ)] - rank[typeOf(b.typ)] || String(a.amne || "").localeCompare(String(b.amne || ""), "sv"));
  return m;
}
const colorStyle = e => /^#[0-9a-f]{6}$/i.test(String(e.calendarColor || "")) ? ` style="--event-color:${e.calendarColor}"` : "";
const itemHtml = e => { const k = typeOf(e.typ), lab = k === "prov" ? "Prov" : k === "glosor" ? "Glosor" : k === "lov" ? "Lov" : k === "studiedag" ? "Studiedag" : "Aktivitet";
  return `<button type="button" class="it event-item ${k}" data-event-id="${esc(e._id)}"${colorStyle(e)}><span class="tag">${esc(lab)}</span><span class="txt">${e.amne ? `<b>${esc(e.amne)}</b> ` : ""}${esc(e.text || "")}</span></button>`; };
const itemsHtml = (list, date) => { const visible = list.slice(0, 2); return `<div class="items">${visible.length ? visible.map(itemHtml).join("") : '<div class="none">–</div>'}${list.length > 2 ? `<button type="button" class="more-events" data-more-date="${date}">… (${list.length - 2} fler)</button>` : ""}</div>`; };
const dayCard = (d, list, t, extra = "") => `<article class="day${iso(d) === t ? " active" : ""}${extra}">
  <div><div class="day-name">${["Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag","Söndag"][(d.getUTCDay() + 6) % 7]}</div><div class="day-date">${dLabel(d)}</div></div>${itemsHtml(list, iso(d))}</article>`;

function weekView(ev, t) {
  const mon = addDays(baseMonday(), calOff * 7), {y, w} = weekNo(mon);
  let h = "";
  for (let i = 0; i < 5; i++) { const d = addDays(mon, i), list = ev[iso(d)] || [];
    h += dayCard(d, list, t); }
  return {html: `<div class="menu">${h}</div>`, big: `v. ${w}`, small: `${rangeTxt(mon)} ${y}`, off: calOff};
}
function monthView(ev, t) {
  const [ty, tm] = t.split("-").map(Number), first = new Date(Date.UTC(ty, tm - 1 + monOff, 1));
  const Y = first.getUTCFullYear(), M = first.getUTCMonth(), ym = iso(first).slice(0, 7);
  const rows = Math.ceil(((first.getUTCDay() + 6) % 7 + new Date(Date.UTC(Y, M + 1, 0)).getUTCDate()) / 7), start = monOf(first);
  if (!selDay || selDay.slice(0, 7) !== ym) selDay = t.slice(0, 7) === ym ? t : iso(first);
  let g = '<div class="mgrid"><div class="mh">v.</div>' + "MTOTFLS".split("").map(x => `<div class="mh">${x}</div>`).join("");
  for (let r = 0; r < rows; r++) {
    const wd = addDays(start, r * 7);
    g += `<button class="mw" data-w="${iso(wd)}" aria-label="Visa vecka ${weekNo(wd).w}">${weekNo(wd).w}</button>`;
    for (let c = 0; c < 7; c++) {
      const d = addDays(wd, c), k = iso(d), dayEvents = ev[k] || [], kinds = dayEvents.map(e => `<i class="${typeOf(e.typ)}"${colorStyle(e)}></i>`);
      g += `<button class="md${d.getUTCMonth() !== M ? " out" : ""}${k === t ? " today" : ""}${k === selDay ? " sel" : ""}" data-d="${k}" aria-label="${dLabel(d)}"><span>${d.getUTCDate()}</span><span class="dots">${kinds.join("")}</span></button>`;
    }

function renderCal() {
  const t = todayISO(), r = (calView === "week" ? weekView : monthView)(events(), t);

// Gör kalenderbeskrivningar läsbara: tillåt enkel formatering och klickbara HTTPS-länkar, utan osäker HTML.
function formatDescription(raw) {
  const doc = new DOMParser().parseFromString(String(raw || ""), "text/html");
  const allowed = new Set(["B","STRONG","I","EM","U","P","BR","UL","OL","LI","H1","H2","H3","H4","H5","H6","BLOCKQUOTE","A"]);
  function clean(parent) {
    for (const node of [...parent.childNodes]) {
      if (node.nodeType === Node.TEXT_NODE) {
        const text = node.nodeValue;
        const re = /https:\/\/[^\s<>"']+/g;
        if (!re.test(text)) continue;
        re.lastIndex = 0;
        const frag = doc.createDocumentFragment();
        let last = 0, match;
        while ((match = re.exec(text))) {
          let url = match[0], suffix = "";
          while (/[),.!?;:]$/.test(url)) { suffix = url.slice(-1) + suffix; url = url.slice(0, -1); }
          if (match.index > last) frag.append(doc.createTextNode(text.slice(last, match.index)));
          const a = doc.createElement("a"); a.href = url; a.textContent = url; a.target = "_blank"; a.rel = "noopener noreferrer";
          frag.append(a); if (suffix) frag.append(doc.createTextNode(suffix));
          last = match.index + match[0].length;
        }
        if (last < text.length) frag.append(doc.createTextNode(text.slice(last)));
        node.replaceWith(frag);
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        clean(node);
        if (!allowed.has(node.tagName)) {
          node.replaceWith(...node.childNodes);
          continue;
        }
        for (const attr of [...node.attributes]) {
          if (node.tagName === "A" && attr.name === "href" && /^https:\/\//i.test(attr.value)) continue;
          node.removeAttribute(attr.name);
        }
        if (node.tagName === "A") {
          if (!/^https:\/\//i.test(node.getAttribute("href") || "")) {
            node.replaceWith(...node.childNodes);
            continue;
          }
          node.setAttribute("target", "_blank"); node.setAttribute("rel", "noopener noreferrer");
        }
      } else node.remove();
    }
  }
  clean(doc.body);
  return doc.body.innerHTML.replace(/<p><\/p>/g, "");
}

// ---------- Knappar ----------
document.querySelectorAll(".nav").forEach(n => n.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; touch();
  const s = +b.dataset.s || 0;                                          // ‹ = -1, › = +1, "Idag" = 0
  if (n.dataset.for === "menu") { menuOff = s ? menuOff + s : 0; renderMenu(); return; }
  if (!s) { calOff = monOff = 0; selDay = null; } else if (calView === "week") calOff += s; else monOff += s;
  renderCal();
}));

});
document.getElementById("cal").addEventListener("click", e => {
  const moreButton = e.target.closest("[data-more-date]");
  if (moreButton) {
    const date = moreButton.dataset.moreDate;
    const list = events()[date] || [];
    const prettyDate = new Intl.DateTimeFormat("sv-SE", {dateStyle:"full", timeZone:"Europe/Stockholm"}).format(new Date(date + "T12:00:00"));
    document.getElementById("eventTitle").textContent = "Alla aktiviteter";
    document.getElementById("eventMeta").textContent = prettyDate;
    document.getElementById("eventDescription").innerHTML = formatDescription(list.map((item, i) => (i + 1) + ". " + (item.title || item.text || "Aktivitet") + (item.timeText ? " (" + item.timeText + ")" : "") + (item.description ? "\n" + item.description : "")).join("\n\n"));
    document.getElementById("eventDialog").showModal();
    return;
  }
  const eventButton = e.target.closest("[data-event-id]");
  if (eventButton) {
    const item = (typeof KALENDER !== "undefined" ? KALENDER : []).find(x => String(x._id) === eventButton.dataset.eventId);
    if (item) {
      document.getElementById("eventTitle").textContent = item.title || item.text || "Uppgift";
      const dateText = item.datum ? new Intl.DateTimeFormat("sv-SE", {dateStyle:"full", timeZone:"Europe/Stockholm"}).format(new Date(item.datum + "T12:00:00")) : "";
      document.getElementById("eventMeta").textContent = [dateText, item.timeText, item.calendar].filter(Boolean).join(" · ");
      document.getElementById("eventDescription").innerHTML = formatDescription(item.description || "Ingen beskrivning finns sparad för den här aktiviteten.");
      const dialog = document.getElementById("eventDialog");
      if (typeof dialog.showModal === "function") dialog.showModal(); else alert((item.title || "Uppgift") + "\n\n" + (item.description || "Ingen beskrivning finns."));
    }
    return;
  }
  const b = e.target.closest("button"); if (!b) return; touch();
  if (b.dataset.w) { calOff = Math.round((utc(b.dataset.w) - baseMonday()) / (7 * 864e5)); calView = "week"; }
  else if (b.dataset.d) { const d = utc(b.dataset.d), [ty, tm] = todayISO().split("-").map(Number);
    selDay = b.dataset.d; monOff = (d.getUTCFullYear() - ty) * 12 + d.getUTCMonth() - (tm - 1); }
  renderCal();
});
document.getElementById("closeEvent").addEventListener("click", () => document.getElementById("eventDialog").close());

// Skärmen hoppar själv tillbaka till nuvarande vecka/månad efter 2 minuter utan tryck.
setInterval(() => {
  if (performance.now() - touched < 120000) return;

    menuOff = calOff = monOff = 0; selDay = null; renderAll();

async function load() {                                  // hämtar bara schemat (lektioner) – inget om mat
  try { const sc = normSched(await getJSON("schedule.json?t=" + Date.now())); if (sc) { schedules = sc; saveCache("schedule", sc); } } catch {}
  tick();
}
// ---------- Schemabild ----------
// Vanlig <img src> rakt av. Inga fetch/base64/SVG-omvägar som kan gå sönder i vissa webbläsare.
// Är bilden en hel A4-sida (inte 1090 x 1064) klipps tabellen ut med CSS (klassen "crop").
let schemaToken = 0;
function loadSchema(c) {
  const url = SCHEMA_IMG[c], root = document.documentElement, box = document.getElementById("schemaBox");
  const light = document.getElementById("imgLight"), dark = document.getElementById("imgDark");
  const err = document.getElementById("schemaErr"), token = ++schemaToken;
  let retried = false;
  box.classList.remove("err", "crop");
  root.classList.remove("has-dark");
  light.onload = () => {
    if (token !== schemaToken) return;
    const W = light.naturalWidth, H = light.naturalHeight;
    box.classList.toggle("crop", !!H && Math.abs(W / H - 1090 / 1064) > 0.02);
    box.classList.remove("err");
  };
  light.onerror = () => {
    if (token !== schemaToken) return;
    if (!retried) { retried = true; light.src = url + "?v=" + Date.now(); return; }   // ett nytt försök förbi cachen
    err.textContent = "Kunde inte ladda schemabilden (" + url + "). Kontrollera att filen finns och heter exakt så.";
    box.classList.add("err");
  };
  light.src = url;
  // Mörk bild är valfri: den används bara om den faktiskt har laddats, annars inverteras den ljusa.
  dark.onload = () => { if (token === schemaToken) root.classList.add("has-dark"); };
  dark.onerror = () => {};
  dark.src = `schema-morkt-${c}.png`;
}
// ---------- Klassval (9A / 9B) ----------

// ---------- Svep på mobil: matsedel och kalender ----------
(function enableSwipeNavigation() {
  const targets = [
    { section: ".right", content: "#menu", button: '.nav[data-for="menu"] [data-s="SWIPE"]' },
    { section: ".mid", content: "#cal", button: '.nav[data-for="cal"] [data-s="SWIPE"]' }
  ];

  targets.forEach(({ section, content, button }) => {
    const area = document.querySelector(section);
    if (!area) return;
    let startX = 0, startY = 0, startTime = 0, tracking = false;

    area.addEventListener("touchstart", e => {
      if (e.touches.length !== 1) { tracking = false; return; }
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      startTime = performance.now();
      tracking = true;
    }, { passive: true });

    area.addEventListener("touchend", e => {
      if (!tracking || !e.changedTouches.length) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      const elapsed = performance.now() - startTime;

      // Ignorera vertikal scroll, korta tryck och små rörelser.
      if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.25 || elapsed > 900) return;

      const panel = document.querySelector(content);
      const nav = area.querySelector(".nav");
      if (!panel || !nav) return;

      // Vänstersvep = framåt, högersvep = bakåt.
      const direction = dx < 0 ? 1 : -1;
      const nextButton = nav.querySelector('[data-s="' + direction + '"]');
      if (!nextButton) return;

      // Mjuk ut-/inanimation runt den befintliga navigeringen.
      panel.style.transition = "transform 160ms ease, opacity 160ms ease";
      panel.style.transform = "translateX(" + (direction > 0 ? "-18px" : "18px") + ")";
      panel.style.opacity = "0.35";

      window.setTimeout(() => {
        nextButton.click();
        panel.style.transition = "none";
        panel.style.transform = "translateX(" + (direction > 0 ? "18px" : "-18px") + ")";
        panel.style.opacity = "0.35";
        requestAnimationFrame(() => requestAnimationFrame(() => {
          panel.style.transition = "transform 220ms ease, opacity 220ms ease";
          panel.style.transform = "translateX(0)";
          panel.style.opacity = "1";
        }));
      }, 160);
    }, { passive: true });

    area.addEventListener("touchcancel", () => { tracking = false; }, { passive: true });
  });
})();
