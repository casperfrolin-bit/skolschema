// Vid webbläsarzoom (Ctrl +/-) ändras inte enheterna, så hela sidan skalas och flyttas som en helhet.
(function () {
  var d = document.documentElement, lastPhys = window.innerWidth * window.devicePixelRatio;
  function apply() {
    var w = window.innerWidth, h = window.innerHeight;
    d.style.setProperty("--vw", w / 100 + "px");
    d.style.setProperty("--vh", h / 100 + "px");
    d.classList.toggle("wide", w >= h && w >= 900);
    d.classList.toggle("narrow", w <= 900);
    lastPhys = w * window.devicePixelRatio;
  }
  apply();
  window.addEventListener("resize", function () {
    // Zoom ändrar CSS-bredden men inte antalet riktiga pixlar -> gör inget. Annars är det en riktig storleksändring.
    if (Math.abs(window.innerWidth * window.devicePixelRatio - lastPhys) > 4) apply();
  });
})();

<script>
const TZ = "Europe/Stockholm";
const DAYS = ["måndag","tisdag","onsdag","torsdag","fredag"];
// Tidslinjen: y-position (px i den beskurna bilden, 1064 px hög) för 07:00 och pixlar per timme.
const Y7 = 62.5, PER_HOUR = 90.36, IMG_H = 1064;
const SCHEMA_IMG = {
  "9A": "images/schema-9A.png",
  "9B": "images/schema-9B.png"
};
const readSeed = id => { try { return JSON.parse(document.getElementById(id).textContent); } catch { return null; } };
const readCache = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const saveCache = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
// Det senast kända visas direkt; färsk data hämtas i bakgrunden och byts in när den kommer.
// Schemat ligger som {"9A": [...], "9B": [...]}. En gammal platt lista räknas som 9B.
const normSched = v => Array.isArray(v) ? {"9A": [], "9B": v} : (v && typeof v === "object" ? v : null);
let schedules = [normSched(readCache("schedule")), normSched(readSeed("seed-schedule"))].find(Boolean) || {};
let cls = "9B";
try { const q = new URLSearchParams(location.search).get("klass"); const s = q || localStorage.getItem("klass"); if (SCHEMA_IMG[s]) cls = s; } catch {}
const newer = (a, b) => a && b ? ((a.updated || "") >= (b.updated || "") ? a : b) : (a || b);
let menu = newer(readCache("menu"), readSeed("seed-menu")) || {days: []};
menu.days ||= [];

// ---------- Tid från internet (inte enhetens klocka) ----------
// Klockan räknar vidare med performance.now(), så den påverkas inte om någon ändrar enhetens klocka.
let base = {server: Date.now(), perf: performance.now()}, synced = false, lastSync = -1e9, trusted = false;
try { const o = localStorage.getItem("timeOffset"); if (o !== null && Number.isFinite(+o)) { base.server += +o; trusted = true; } } catch {}
const now = () => new Date(base.server + (performance.now() - base.perf));
const getJSON = async (url) => {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return r.json();
};
const TIME_SOURCES = [
  async () => { const j = await getJSON("https://worldtimeapi.org/api/timezone/Etc/UTC");
    return j.unixtime * 1000 + (+(String(j.datetime).match(/\.(\d{3})/)?.[1] ?? 0)); },
  async () => { const j = await getJSON("https://timeapi.io/api/time/current/zone?timeZone=UTC");
    return Date.parse(String(j.dateTime).replace(/(\.\d{3})\d*/, "$1") + "Z"); },
  async () => { const r = await fetch(location.href.split("#")[0], {method: "HEAD", cache: "no-store"});
    const d = r.headers.get("Date"); if (!d) throw new Error("no date"); return Date.parse(d) + 500; }
];
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
async function syncTime() {
  // Alla källor frågas samtidigt; den första (i prioritetsordning) som svarar används.
  const runs = TIME_SOURCES.map(src => { const p0 = performance.now();
    return withTimeout(src(), 3000).then(ms => ({ms, p0, p1: performance.now()})); });
  runs.forEach(r => r.catch(() => {}));
  for (const r of runs) {
    try {
      const {ms, p0, p1} = await r;
      if (!Number.isFinite(ms)) continue;
      base = {server: ms + (p1 - p0) / 2, perf: p1};
      synced = trusted = true; lastSync = p1;
      try { localStorage.setItem("timeOffset", String(Math.round(base.server - Date.now()))); } catch {}
      document.getElementById("clock").style.opacity = "";
      tick();

    } catch {}
  }
  if (!trusted) document.getElementById("clock").style.opacity = ".55"; // visar att internettid saknas
  return false;
}

function parts(d) {
  const o = {};
  new Intl.DateTimeFormat("sv-SE", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit",

    .formatToParts(d).forEach(p => o[p.type] = p.value);

  const t = new Date(Date.UTC(y, m - 1, d));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);

const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };

// ---------- Tema ----------
function setTheme(t) {

  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';

function tick() {
  const d = now(), p = parts(d);

  document.getElementById("date").textContent = `${weekday} ${+p.day} ${month} ${p.year} (v. ${week})`;

  const sec = +p.hour*3600 + +p.minute*60 + +p.second;
  const line = document.getElementById("timeLine");
  const hrs = sec/3600;
  if (DAYS.includes(weekday.toLowerCase()) && hrs >= 7 && hrs < 18) {
    const y = Y7 + (hrs - 7) * PER_HOUR;
    line.style.top = (y / IMG_H * 100) + "%";
    line.style.display = "block";
  } else line.style.display = "none";
  const lessons = (schedules[cls] || []).filter(x => x.day === weekday.toLowerCase());
  const cur = lessons.find(x => sec >= toMin(x.start)*60 && sec < toMin(x.end)*60);
  const next = lessons.find(x => toMin(x.start)*60 > sec);
  const el = id => document.getElementById(id);
  const fmt = s => { const [h,m,sc] = hms(s); return (h ? h + " tim " : "") + m + " min " + sc + " sek"; };
  const L = cur || next;
  const room = L && L.room ? ` (${L.room})` : "";
  if (cur) {
    el("lesson").textContent = cur.subject + room;
    el("lessonTime").textContent = `${cur.start.replace(":",".")}–${cur.end.replace(":",".")}`;
    el("remaining").textContent = "Tid till slut: " + fmt(toMin(cur.end)*60 - sec);
  } else if (next) {
    const started = lessons.some(x => toMin(x.end)*60 <= sec);
    el("lesson").textContent = started ? "Rast" : "Skoldagen har inte börjat";
    el("lessonTime").textContent = `Nästa lektion: ${next.subject}${room}`;
    el("remaining").textContent = "Börjar om " + fmt(toMin(next.start)*60 - sec);
  } else {
    el("lesson").textContent = "Ingen lektion";
    el("lessonTime").textContent = "";
    el("remaining").textContent = "";
  }
  renderMenu(p, weekday.toLowerCase());
}

let menuKey = "";
function renderMenu(p, today) {
  // lördag/söndag: visa nästa vecka
  const base = new Date(Date.UTC(+p.year, +p.month-1, +p.day));
  const wd = base.getUTCDay() || 7;
  base.setUTCDate(base.getUTCDate() - (wd - 1) + (wd > 5 ? 7 : 0));
  const key = base.toISOString().slice(0,10) + today + menu.updated;
  if (key === menuKey) return;
  menuKey = key;
  document.getElementById("menu").innerHTML = DAYS.map((name, i) => {
    const dt = new Date(base); dt.setUTCDate(base.getUTCDate() + i);
    const iso = dt.toISOString().slice(0,10);
    const m = menu.days.find(x => x.date === iso);
    const nice = `${dt.getUTCDate()} ${new Intl.DateTimeFormat("sv-SE",{timeZone:"UTC",month:"short"}).format(dt)}`;
    return `<article class="day${name === today && wd <= 5 ? " active" : ""}">
      <div><div class="day-name">${cap(name)}</div><div class="day-date">${nice}</div></div>
      <div class="food"><div>${esc(m?.main || "Ingen uppgift")}</div><div>${esc(m?.alt || "")}</div></div></article>`;
  }).join("");
}
const esc = (s="") => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

// ---------- Direkt hämtning från skolmaten.se/svensgardsskolan (valfri) ----------
// OBS: allt här är synligt för alla som öppnar sidan. Säkrast är att lägga nyckeln som GitHub-secret
// SKOLMATEN_TOKEN (då hämtar GitHub Actions matsedeln åt dig, se README). Fyll bara i här om du vet vad du gör.
// Webbläsaren kan dessutom blockeras av CORS – då hoppas anropet tyst över och sidan använder menu.json.
const SKOLMATEN = {
  token: "",        // <-- klistra in din client token här när du fått den (lämna tom tills dess)
  schoolId: "",     // lämna tom: id:t läses då från data/school_id.txt (skapas av scripts/fetch_menu.py)
  api: "https://skolmaten.se/api/4"
};
async function skolmatenDirect() {
  if (!SKOLMATEN.token) return {};
  let id = SKOLMATEN.schoolId;
  if (!id) { try { id = (await fetch("data/school_id.txt", {cache: "no-store"}).then(r => r.ok ? r.text() : "")).trim(); } catch {} }
  if (!id) return {};
  const out = {}, p = parts(now());
  for (const off of [0, 7]) {
    const d = new Date(Date.UTC(+p.year, +p.month - 1, +p.day + off));
    const wk = isoWeek(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    const yr = new Date(d); yr.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    try {
      const r = await withTimeout(fetch(`${SKOLMATEN.api}/menu/${id}?year=${yr.getUTCFullYear()}&week=${wk}`,
        {headers: {"client-token": SKOLMATEN.token, "Accept": "application/json"}}), 8000);
      if (!r.ok) continue;
      for (const day of (await r.json()).WeekState?.Days || []) {
        const rows = (day.Meals || []).map(m => (m.name || "").trim()).filter(Boolean);
        if (!day.cancelled && rows.length && day.date) out[day.date.slice(0, 10)] = rows;
      }
    } catch {}
  }
  return out;
}

async function load() {
  const bust = "?t=" + Date.now();   // alltid färsk fil, aldrig cachad
  const [sc, mn] = await Promise.allSettled([getJSON("data/schedule.json" + bust), getJSON("data/menu.json" + bust)]);
  if (sc.status === "fulfilled" && normSched(sc.value)) { schedules = normSched(sc.value); saveCache("schedule", schedules); }
  // Börja med senast kända matsedel och lägg färsk data ovanpå, så att en tom/misslyckad hämtning aldrig raderar den.
  const days = new Map((menu.days || []).map(d => [d.date, d]));
  if (mn.status === "fulfilled" && mn.value) for (const d of mn.value.days || []) if (d && d.date) days.set(d.date, d);
  try {                                                                // direkt från Skolmaten (om token finns)
    for (const [date, r] of Object.entries(await skolmatenDirect())) days.set(date, {date, main: r[0], alt: r.slice(1).join(" / ")});
  } catch {}
  if (mn.status === "fulfilled") {
    menu = {updated: new Date().toISOString(), days: [...days.values()]};
    saveCache("menu", menu);
  }
  menuKey = ""; tick();
}
// ---------- Schemabild: klipper automatiskt ut tabellen ur hela A4-bilden ----------
// Originalfilen (med vit/genomskinlig marginal) kan användas som den är. Misslyckas beskärningen visas bilden orörd.
const schemaCache = {};
function loadSchema(c) {
  const img = document.getElementById("imgLight"), url = SCHEMA_IMG[c];
  if (schemaCache[c]) { img.src = schemaCache[c]; return; }
  img.src = url;
  const src = new Image();
  src.onload = () => {
    try {
      const W = src.naturalWidth, H = src.naturalHeight;
      if (W === 1090 && H === 1064) return;                       // redan utklippt
      const full = document.createElement("canvas"); full.width = W; full.height = H;
      const fx = full.getContext("2d", {willReadFrequently: true});
      fx.fillStyle = "#fff"; fx.fillRect(0, 0, W, H); fx.drawImage(src, 0, 0);
      const d = fx.getImageData(0, 0, W, H).data;
      let minX = W, minY = H;
      for (let y = 0; y < H && minY === H; y++) for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4; if (d[i] < 60 && d[i+1] < 60 && d[i+2] < 60) { minY = y; break; }
      }
      for (let x = 0; x < W && minX === W; x++) for (let y = 0; y < H; y++) {
        const i = (y * W + x) * 4; if (d[i] < 60 && d[i+1] < 60 && d[i+2] < 60) { minX = x; break; }
      }
      if (minX === W || minY === H) return;
      const out = document.createElement("canvas"); out.width = 1090; out.height = 1064;
      const ox = out.getContext("2d"); ox.fillStyle = "#fff"; ox.fillRect(0, 0, 1090, 1064);
      ox.drawImage(full, minX - 6, minY - 6, 1090, 1064, 0, 0, 1090, 1064);
      schemaCache[c] = out.toDataURL("image/png");
      if (cls === c) img.src = schemaCache[c];
    } catch (e) { /* behåll originalbilden */ }
  };
  src.src = url;
}
// ---------- Klassval (9A / 9B) ----------
function setClass(c, save = true) {
  cls = c;
  const root = document.documentElement, dark = document.getElementById("imgDark");
  loadSchema(c);
  root.classList.remove("no-dark");
  dark.onerror = () => root.classList.add("no-dark");   // finns ingen mörk bild används den ljusa inverterad
  dark.src = `images/schema-morkt-${c}.png`;
  document.getElementById("className").textContent = c;
  document.getElementById("classSel").value = c;
  document.title = `${c} - SchemavisarePRO`;
  if (save) try { localStorage.setItem("klass", c); } catch {}
  tick();
}
document.getElementById("classSel").onchange = e => setClass(e.target.value);
setClass(cls, false);

function loop() { tick(); setTimeout(loop, 1000 - now().getMilliseconds() + 5); }  // tickar på hel sekund
loop();                       // allt ritas direkt, innan något nätverk svarat
syncTime(); load();           // uppdateras i bakgrunden vid varje sidladdning
document.addEventListener("visibilitychange", () => { if (!document.hidden) { syncTime(); load(); } });
window.addEventListener("pageshow", e => { if (e.persisted) { syncTime(); load(); } });
setInterval(() => { if (!synced || performance.now() - lastSync > 10 * 60 * 1000) syncTime(); }, 30 * 1000);
setInterval(load, 10 * 60 * 1000);
</script>
