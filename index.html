<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schema & Matsedel</title>
<style>
*{box-sizing:border-box}
:root{--h:calc(clamp(32px,4vw,72px)*1.1 + 1.5vh);--bg:#f4f4f4;--panel:#fff;--text:#111;--muted:#666;--line:#d9d9d9;--hl:#111;--hl-text:#fff}
:root[data-theme=dark]{--bg:#151515;--panel:#222;--text:#f2f2f2;--muted:#aaa;--line:#3a3a3a;--hl:#f2f2f2;--hl-text:#111}
html,body{margin:0;height:100%}
body{font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
.screen{min-height:100dvh;display:flex;flex-direction:column;gap:2vh;padding:2vh 2.5vw 2vh}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw}
.time{display:flex;flex-direction:column;gap:.6vh}
.class-name{font-size:clamp(44px,7vw,130px);font-weight:800;line-height:1;text-align:center}
.clock{font-size:clamp(34px,4.5vw,80px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.date{font-size:clamp(16px,1.8vw,32px);color:var(--muted)}
.now{margin-top:1vh;width:0;min-width:100%}
.layout{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:2vw;min-height:0}
.left,.right{display:flex;flex-direction:column;min-height:0}
.left{align-items:center;padding-top:var(--h)}
.right{padding-bottom:9vh}
.sched{width:min(100%,calc((100dvh - 36vh - var(--h))*.975))}
.schedule-img{display:block;position:relative;overflow:hidden}
.time-line{position:absolute;left:0;right:0;height:2px;margin-top:-1px;background:#e53935;display:none;pointer-events:none}
.schedule-img img{display:block;width:100%;height:auto}
.img-dark{display:none}
:root[data-theme=dark] .img-light{display:none}
:root[data-theme=dark] .img-dark{display:block}
:root.no-dark .img-dark{display:none!important}
:root.no-dark[data-theme=dark] .img-light{display:block;filter:invert(1)}
.current{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 2vw}
.lesson{font-size:clamp(26px,3.6vw,64px);font-weight:800}
.lesson-time{font-size:clamp(20px,2.4vw,44px);font-weight:700;color:var(--muted);white-space:nowrap}
.remaining{font-size:clamp(14px,1.5vw,26px);color:var(--muted);margin-top:.6vh;font-variant-numeric:tabular-nums}
h1{margin:0 0 1.5vh;font-size:clamp(32px,4vw,72px);line-height:1.1;font-weight:800}
.menu{flex:1;display:flex;flex-direction:column;gap:1.2vh}
.day{flex:1;display:grid;grid-template-columns:auto 1fr;gap:2vw;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:1.2vh 1.6vw}
.day.active{background:var(--hl);color:var(--hl-text);border-color:var(--hl)}
.day-name{font-size:clamp(16px,1.7vw,30px);font-weight:800}
.day-date{font-size:clamp(12px,1vw,18px);opacity:.7}
.food{text-align:right;font-size:clamp(13px,1.3vw,24px);line-height:1.25}
.food div+div{opacity:.8;margin-top:.4vh}
.theme-btn{position:fixed;right:max(2vw,env(safe-area-inset-right));bottom:max(2vh,env(safe-area-inset-bottom));width:clamp(44px,4vw,64px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:55%;height:55%}
.theme-btn:focus-visible{outline:3px solid var(--text);outline-offset:2px}
@media (min-aspect-ratio:1/1) and (min-width:900px){
  .screen{height:100dvh;min-height:0;overflow:hidden}
  .layout{grid-template-columns:auto minmax(0,60vw);justify-content:center;column-gap:3vw}
  .left{height:100%;min-height:0}
  .sched{height:100%;width:auto;display:grid;grid-template-columns:min-content;grid-template-rows:minmax(0,1fr) auto}
  .schedule-img{min-height:0}
  .schedule-img img{height:100%;width:auto;aspect-ratio:1060/1087}
  .lesson{font-size:clamp(18px,3.2vh,64px);line-height:1.15}
  .lesson-time{font-size:clamp(14px,2.4vh,44px)}
  .remaining{font-size:clamp(13px,1.9vh,28px)}
}
@media(max-width:900px){.left{padding-top:0}.layout{grid-template-columns:1fr}.schedule-img img{height:auto}.menu{min-height:60vh}.food{font-size:15px}}
</style>
</head>

        <img class="img-dark" src="images/schema-morkt.png" alt="Schema" onerror="document.documentElement.classList.add('no-dark')">
        <div id="timeLine" class="time-line"></div>
      </div>
    <div class="now">
        <div class="current">
          <div id="lesson" class="lesson">–</div>
          <div id="lessonTime" class="lesson-time"></div>
        </div>
        <div id="remaining" class="remaining"></div>
      </div>
    </div>
    </section>
    <section class="right">
      <h1>Matsedel</h1>
      <div id="menu" class="menu"></div>
    </section>
  </div>
  <button id="themeBtn" class="theme-btn" aria-label="Byt ljust/mörkt läge"></button>
</main>
<script>
const TZ = "Europe/Stockholm";
const DAYS = ["måndag","tisdag","onsdag","torsdag","fredag"];
// y-position (px i den beskurna bilden, 1087 px hög) för 07:00, 07:30 ... 18:00
const TICKS = [235,282,328.5,374,420,466.5,513,560,608,655,703,750.5,798,845,892,940,987,1034,1081,1128,1175.5,1223,1270];
const IMG_TOP = 173, IMG_H = 1087;
let schedule = [], menu = {days: []};

// ---------- Tid från internet (inte enhetens klocka) ----------
// Klockan räknar vidare med performance.now(), så den påverkas inte om någon ändrar enhetens klocka.
let base = {server: Date.now(), perf: performance.now()}, synced = false, lastSync = -1e9;
const now = () => new Date(base.server + (performance.now() - base.perf));
const getJSON = async (url) => {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return r.json();
};
const TIME_SOURCES = [
  async () => { const j = await getJSON("https://worldtimeapi.org/api/timezone/Etc/UTC");
    return j.unixtime * 1000 + (+(String(j.datetime).match(/\.(\d{3})/)?.[1] ?? 0)); },
  async () => { const j = await getJSON("https://timeapi.io/api/time/current/zone?timeZone=UTC");
    return Date.parse(String(j.dateTime).replace(/(\.\d{3})\d*/, "$1") + "Z"); },
  async () => { const r = await fetch(location.href.split("#")[0], {method: "HEAD", cache: "no-store"});
    const d = r.headers.get("Date"); if (!d) throw new Error("no date"); return Date.parse(d) + 500; }
];
async function syncTime() {
  for (const src of TIME_SOURCES) {
    try {
      const p0 = performance.now(), ms = await src(), p1 = performance.now();
      if (!Number.isFinite(ms)) continue;
      base = {server: ms + (p1 - p0) / 2, perf: p1};
      synced = true; lastSync = p1;
      document.getElementById("clock").style.opacity = "";
      return true;
    } catch {}
  }
  if (!synced) document.getElementById("clock").style.opacity = ".55"; // visar att internettid saknas
  return false;
}

function parts(d) {
  const o = {};
  new Intl.DateTimeFormat("sv-SE", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"})
    .formatToParts(d).forEach(p => o[p.type] = p.value);
  return o;
}
function isoWeek(y, m, d) {
  const t = new Date(Date.UTC(y, m - 1, d));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const hms = s => [Math.floor(s/3600), Math.floor(s%3600/60), s%60];
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };

// ---------- Tema ----------
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch {}
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  document.getElementById("themeBtn").innerHTML = t === "dark" ? sun : moon;
}
let saved = "light"; try { saved = localStorage.getItem("theme") || "light"; } catch {}
setTheme(saved);
document.getElementById("themeBtn").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

// ---------- Rendering ----------
function tick() {
  const d = now(), p = parts(d);
  const weekday = cap(new Intl.DateTimeFormat("sv-SE", {timeZone:TZ, weekday:"long"}).format(d));
  const month = new Intl.DateTimeFormat("sv-SE", {timeZone:TZ, month:"long"}).format(d);
  const week = isoWeek(+p.year, +p.month, +p.day);
  document.getElementById("clock").textContent = `${p.hour}:${p.minute}:${p.second}`;
  document.getElementById("date").textContent = `${weekday} ${+p.day} ${month} ${p.year} (v. ${week})`;

  const sec = +p.hour*3600 + +p.minute*60 + +p.second;
  const line = document.getElementById("timeLine");
  const t = (sec/3600 - 7) * 2;
  if (DAYS.includes(weekday.toLowerCase()) && t >= 0 && t < 22) {
    const i = Math.floor(t), y = TICKS[i] + (TICKS[i+1] - TICKS[i]) * (t - i);
    line.style.top = ((y - IMG_TOP) / IMG_H * 100) + "%";
    line.style.display = "block";
  } else line.style.display = "none";
  const lessons = schedule.filter(x => x.day === weekday.toLowerCase());
  const cur = lessons.find(x => sec >= toMin(x.start)*60 && sec < toMin(x.end)*60);
  const next = lessons.find(x => toMin(x.start)*60 > sec);
  const el = id => document.getElementById(id);
  const fmt = s => { const [h,m,sc] = hms(s); return (h ? h + " tim " : "") + m + " min " + sc + " sek"; };
  const L = cur || next;
  const room = L && L.room ? ` (${L.room})` : "";
  if (cur) {
    el("lesson").textContent = cur.subject + room;
    el("lessonTime").textContent = `${cur.start.replace(":",".")}–${cur.end.replace(":",".")}`;
    el("remaining").textContent = "Tid till slut: " + fmt(toMin(cur.end)*60 - sec);
  } else if (next) {
    const started = lessons.some(x => toMin(x.end)*60 <= sec);
    el("lesson").textContent = started ? "Rast" : "Skoldagen har inte börjat";
    el("lessonTime").textContent = `Nästa lektion: ${next.subject}${room}`;
    el("remaining").textContent = "Börjar om " + fmt(toMin(next.start)*60 - sec);
  } else {
    el("lesson").textContent = "Ingen lektion";
    el("lessonTime").textContent = "";
    el("remaining").textContent = "";
  }
  renderMenu(p, weekday.toLowerCase());
}

let menuKey = "";
function renderMenu(p, today) {
  // lördag/söndag: visa nästa vecka
  const base = new Date(Date.UTC(+p.year, +p.month-1, +p.day));
  const wd = base.getUTCDay() || 7;
  base.setUTCDate(base.getUTCDate() - (wd - 1) + (wd > 5 ? 7 : 0));
  const key = base.toISOString().slice(0,10) + today + menu.updated;
  if (key === menuKey) return;
  menuKey = key;
  document.getElementById("menu").innerHTML = DAYS.map((name, i) => {
    const dt = new Date(base); dt.setUTCDate(base.getUTCDate() + i);
    const iso = dt.toISOString().slice(0,10);
    const m = menu.days.find(x => x.date === iso);
    const nice = `${dt.getUTCDate()} ${new Intl.DateTimeFormat("sv-SE",{timeZone:"UTC",month:"short"}).format(dt)}`;
    return `<article class="day${name === today && wd <= 5 ? " active" : ""}">
      <div><div class="day-name">${cap(name)}</div><div class="day-date">${nice}</div></div>
      <div class="food"><div>${esc(m?.main || "Ingen uppgift")}</div><div>${esc(m?.alt || "")}</div></div></article>`;
  }).join("");
}
const esc = (s="") => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

async function load() {
  try { schedule = await (await fetch("data/schedule.json", {cache:"no-store"})).json(); } catch {}
  try { menu = await (await fetch("data/menu.json", {cache:"no-store"})).json(); menu.days ||= []; } catch {}
  menuKey = ""; tick();
}
(async () => { await syncTime(); await load(); })();
setInterval(tick, 1000);
setInterval(() => { if (!synced || performance.now() - lastSync > 10 * 60 * 1000) syncTime(); }, 30 * 1000);
setInterval(load, 30 * 60 * 1000);
</script>
