name: Uppdatera skolmat

on:
  schedule:
    - cron: "0 4,6 * * 1"     # måndag morgon (ny vecka), två försök
    - cron: "30 4 * * 2-5"    # övriga vardagar, som reserv
  workflow_dispatch:           # kan även köras manuellt under Actions

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera webbläsare
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Hämta skolmaten
        run: python scripts/fetch_menu.py
      - name: Spara om något ändrats
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Uppdaterar skolmat" && git push)
