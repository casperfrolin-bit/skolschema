name: Uppdatera skolmat
on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_menu.py
      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/menu.json
          git diff --staged --quiet || (git commit -m "Uppdaterar skolmat" && git push)
