name: Uppdatera skolmat

on:
  schedule:
    - cron: "0 3-10 * * 1-5"
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta skolmaten
        run: python fetch_menu.py
      - name: Spara om något ändrats
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Uppdaterar skolmat" && git pull --rebase && git push)
