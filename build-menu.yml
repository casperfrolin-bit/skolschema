name: Bygg matsedel från textfil

on:
  push:
    paths:
      - "data/matsedel.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bygg matsedel
        run: python scripts/build_menu.py
      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ index.html
          git diff --staged --quiet || (git commit -m "Uppdaterar matsedel från matsedel.txt" && git pull --rebase && git push)
